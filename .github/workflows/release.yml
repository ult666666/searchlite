name: Release

# Builds the npm package from a version tag, smoke-tests the packed tarball
# in a clean project, and attaches it with SHA-256 checksums to the GitHub
# release. Run it by hand to (re)build the assets of an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack the tarball
        run: |
          if [ -f scripts/package_local_review.py ]; then
            npm run package:local -- release
          else
            mkdir release
            npm pack --offline --pack-destination release
          fi
      - name: Smoke-test the tarball in a clean project
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --offline --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/tarball-cache" "$GITHUB_WORKSPACE"/release/*.tgz
          node -e "require('searchlite')"
          node --input-type=module -e "import 'searchlite'"
      - name: Smoke-test the portable workflow
        run: |
          version=$(node -p "require('./package.json').version")
          archive="$GITHUB_WORKSPACE/release/searchlite-local-review-$version.zip"
          if [ ! -f "$archive" ]; then exit 0; fi
          python3 -m zipfile -e "$archive" "$RUNNER_TEMP/portable"
          cd "$RUNNER_TEMP/portable/searchlite-local-review-$version"
          npm install --offline --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/portable-cache"
          node examples/search-docs.js index examples/fixtures/relevance-notes notes.json
          node examples/search-docs.js search notes.json '"invoice retention"'
          node examples/search-docs.js evaluate notes.json examples/fixtures/relevance-notes/judgments.json
          node examples/search-docs.js compare notes.json notes.json examples/fixtures/relevance-notes/judgments.json
          status=0
          node examples/search-docs.js compare notes.json notes.json examples/fixtures/relevance-notes/judgments-unmet.json || status=$?
          test "$status" -eq 3
      - name: Write checksums
        working-directory: release
        run: |
          if [ -f SHA256SUMS ]; then
            cp SHA256SUMS SHA256SUMS.txt
          else
            python3 -c 'import hashlib,pathlib; files=sorted(pathlib.Path(".").glob("*.tgz")); pathlib.Path("SHA256SUMS.txt").write_text("".join(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n" for p in files))'
          fi
      - name: Attach the assets to the release
        run: |
          created=false
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --draft
            created=true
          fi
          gh release upload "$TAG" release/* --clobber
          if [ "$created" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
