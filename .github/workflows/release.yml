name: Release

# Builds the npm package from a version tag, smoke-tests the packed tarball
# in a clean project, and attaches it with SHA-256 checksums to the GitHub
# release. Run it by hand to (re)build the assets of an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Pack the tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
      - name: Smoke-test the tarball in a clean project
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/release/*.tgz
          node -e "require('searchlite')"
          node --input-type=module -e "import 'searchlite'"
      - name: Write checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Attach the assets to the release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
